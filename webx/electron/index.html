<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebX (Electron)</title>
    <style>
      body, html { height: 100%; margin: 0; }
      #controls { padding: 8px; background: #eee; display:flex; gap:8px; align-items:center }
      #tabs { padding: 8px; background: #ddd; display:flex; gap:4px; }
      .webview { width: 100%; height: calc(100% - 96px); border: none; }
      button.active { background: #bbb; }
    </style>
  </head>
  <body>
    <div id="controls">
      <div id="tabs"></div>
      <input id="address" style="flex:1" placeholder="https://example.com" />
      <button id="go">Go</button>
      <button id="newtab">＋ Tab</button>
      <button id="bookmark">☆</button>
      <button id="showBookmarks">Bookmarks</button>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
